<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Portal - Fixed Version</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-left: 5px solid #1a73e8;
            padding: 15px;
            margin-top: 12px;
            border-radius: 6px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1557b0;
        }
        .badge-ptd {
            background-color: #e6f4ea;
            color: #137333;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-mrp {
            background-color: #feefc3;
            color: #b06000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-msg {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Master Portal Dashboard</h2>
    
    <!-- Login Section -->
    <div id="login-section">
        <h3>Customer Login</h3>
        <div class="form-group">
            <label>Customer Code</label>
            <input type="text" id="login-code" placeholder="Enter Customer Code (e.g. CUST001)">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter Password (Default: 123456)">
        </div>
        <button onclick="handleLogin()">Login</button>
    </div>

    <!-- Dashboard Section (Hidden by Default) -->
    <div id="dashboard-section" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="welcome-user">Product Catalog</h3>
            <button onclick="handleLogout()" style="width: auto; background-color: #dc3545; padding: 8px 16px;">Logout</button>
        </div>
        
        <div id="status-container"></div>
        <div id="product-list">Loading products...</div>
    </div>
</div>

<script>
    // ==========================================
    // 1. Firebase Configuration (Replace with your details)
    // ==========================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Global State to manage Data and Overrides safely (Order-Independent)
    let masterProducts = [];
    let productOverrides = {};

    // ==========================================
    // 2. Safe Data Loading (Fixes Race Condition / PTD = 0 Issue)
    // ==========================================
    function loadDataAndRender() {
        const listDiv = document.getElementById('product-list');
        listDiv.innerText = "Syncing latest master data & PTD overrides...";

        const productsRef = database.ref('products');
        const overridesRef = database.ref('productOverrides');

        // Fetch products and overrides simultaneously
        Promise.all([productsRef.once('value'), overridesRef.once('value')])
            .then((snapshots) => {
                const prodSnap = snapshots[0];
                const overrideSnap = snapshots[1];

                // Safely convert products snapshot to array
                masterProducts = [];
                if (prodSnap.exists()) {
                    const val = prodSnap.val();
                    masterProducts = Array.isArray(val) ? val : Object.values(val);
                }

                // Store overrides object
                productOverrides = overrideSnap.exists() ? overrideSnap.val() : {};

                // Render after ensuring all data is fully loaded
                renderProducts();
            })
            .catch(err => {
                console.error("Data loading error:", err);
                listDiv.innerHTML = "<p style='color:red;'>Error loading data from Firebase. Check connection or permission.</p>";
            });
    }

    // ==========================================
    // 3. Render Product List
    // ==========================================
    function renderProducts() {
        const listDiv = document.getElementById('product-list');
        listDiv.innerHTML = "";

        if (!masterProducts || masterProducts.length === 0) {
            listDiv.innerHTML = "<p>No products found in Master Sheet.</p>";
            return;
        }

        masterProducts.forEach(prod => {
            if (!prod) return;

            const code = prod.code || prod.Code || 'N/A';
            const name = prod.name || prod.Name || prod.ItemName || 'Unnamed Product';
            const mrp = prod.MRP || prod.mrp || 0;
            
            // Check override first; fall back to product PTD or 0
            let ptd = prod.PTD || prod.ptd || 0;
            if (productOverrides && productOverrides[code] && productOverrides[code].PTD !== undefined) {
                ptd = productOverrides[code].PTD;
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="margin:0; font-size: 16px;">${name} <span style="font-size:12px; color:#666;">(${code})</span></h4>
                    <div>
                        <span class="badge-mrp">MRP: ₹${parseFloat(mrp).toFixed(2)}</span>
                        <span class="badge-ptd">PTD: ₹${parseFloat(ptd).toFixed(2)}</span>
                    </div>
                </div>
            `;
            listDiv.appendChild(card);
        });
    }

    // ==========================================
    // 4. Handle Login (Fixes Password Trimming Bug)
    // ==========================================
    function handleLogin() {
        const codeInput = document.getElementById('login-code').value.trim();
        const passwordInput = document.getElementById('login-password').value.trim();

        if (!codeInput || !passwordInput) {
            alert("Kripya Customer Code aur Password dono bharein!");
            return;
        }

        database.ref('customers/' + codeInput).once('value').then(snapshot => {
            if (snapshot.exists()) {
                const custData = snapshot.val();
                
                // Trimming saved password to avoid space mismatches
                const savedPassword = (custData.password || "123456").toString().trim();

                if (savedPassword === passwordInput) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    document.getElementById('welcome-user').innerText = `Welcome, ${custData.name || codeInput}`;
                    
                    // Load data fresh upon successful login
                    loadDataAndRender();
                } else {
                    alert("Galat Password! Agar code badla tha, toh default password 123456 try karein.");
                }
            } else {
                alert("Customer Code nahi mila! Confirm karein ki Naye Master Sheet upload ke baad Code change toh nahi hua.");
            }
        }).catch(err => alert("Login Error: " + err.message));
    }

    // ==========================================
    // 5. Logout Functionality
    // ==========================================
    function handleLogout() {
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('login-code').value = '';
        document.getElementById('login-password').value = '';
    }

    // ==========================================
    // 6. Network-First Service Worker Strategy (Bypasses Phone Stale Cache)
    // ==========================================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                reg.update(); // Force checking for updated JS/HTML code on server
            }).catch(err => console.log('SW registration note:', err));
        });
    }
</script>

</body>
</html>
